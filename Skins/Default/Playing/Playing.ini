; ==============================================================================
; O2Game Playing Scene Configuration
; ==============================================================================
; This file defines the layout, positions, and behavior of the gameplay scene.
; The engine supports both absolute coordinates (fallback) and dynamic
; column-width based rendering.
; ==============================================================================

; ------------------------------------------------------------------------------
; [Key#N] Sections (e.g. [Key#7], [Key#6], etc.)
; Defines the layout for N-key mode.
; ------------------------------------------------------------------------------
; ColumnStart    : The X-coordinate where the leftmost lane begins.
; ColumnWidth    : Comma-separated list of widths for each lane. If provided, notes will dynamically use these widths.
; KeyOffset      : Adjusts the vertical offset of KeyButton and KeyLighting.
; NoteHeight     : Customizes the height of the notes.
; ImageFlip      : 1 or 0 per lane (e.g. 0|0|1|0) to flip the image horizontally.
; ImageAlignment : L, R, or C (Left, Right, Center) to align KeyButtons/Lighting inside the lane. Default is C.
; NoStretchToColumn : Set to 1 or true to prevent KeyButton from automatically stretching to match the ColumnWidth.
;
; Fallback:
; If ColumnStart/ColumnWidth are omitted, you MUST provide explicit coordinates:
; KeyButton      = X,Y | X,Y | X,Y ...
; KeyLighting    = X,Y | X,Y | X,Y ...
; KeyDown        = X,Y | X,Y | X,Y ...
; ------------------------------------------------------------------------------

[Key#7]
NoStretchToColumn = False
ImageFlip = 0|0|1|0|0|1|1
ImageAlignment = L|C|R|C|L|C|R
ColumnStart = 5
ColumnWidth = 28,22,28,32,28,22,28
KeyOffset = 2

[Key#6]
ColumnStart = 5
ColumnWidth = 34,26,34,34,26,34
KeyOffset = 2

[Key#5]
ColumnStart = 5
ColumnWidth = 40,31,46,31,40
NoteHeight = 8

[Key#4]
ColumnStart = 5
ColumnWidth = 48,46,46,48
NoteHeight = 8

; ------------------------------------------------------------------------------
; [Numerics] Section
; Defines positioning for numbers (Combo, Score, Time, etc.)
; Format: X, Y, MaxDigits?, Direction?, FillWithZero?
; Direction    : LEFT, RIGHT, MID
; FillWithZero : TRUE or FALSE (e.g., for time '01:05')
; ------------------------------------------------------------------------------
[Numerics]
Score = 198,567,99,LEFT,FALSE
Jam = 100,120,4,MID,FALSE
Combo = 99,194,4,MID,FALSE
LongNoteCombo = 99,300,5,MID,FALSE
Stats = 655,576,9,LEFT,FALSE|725,576,9,LEFT,FALSE|655,585,9,LEFT,FALSE|725,585,9,LEFT,FALSE|671,561,9,LEFT,FALSE
Minute = 347,569,9,LEFT,FALSE
Second = 409,569,2,LEFT,TRUE

; ------------------------------------------------------------------------------
; [Sprites] Section
; Defines positioning for animated elements (Logos, TargetBar, LifeBar)
; Format: X, Y, AnchorPointX?, AnchorPointY?, FPS?
; Note: The engine automatically detects the number of frames from the images.
; AnchorPoint values range between 0.0 to 1.0 (default 0).
; ------------------------------------------------------------------------------
[Sprites]
JamLogo = 99,97,0.5,0.5,13.33
ComboLogo = 99,213,0.5,1,15.0
LifeBar = 203,247,0,0,15.0
LongNoteLogo = 99,290,0.5,0.5,15.0
TargetBar = 3,408,0,0,5.0

; ------------------------------------------------------------------------------
; [Effects] Section
; Hardcoded visual effects. Format: X, Y, FPS?, TintColor?
; Using X, Y adds an offset to the generic calculated lane position.
; ------------------------------------------------------------------------------
[Effects]
HitEffect = 0,15,30.0
HoldEffect = 0,45,30.0

; ------------------------------------------------------------------------------
; [UI] Section
; Defines coordinates for static images, buttons, and rectangles.
; For single-image placements: X, Y
; For clickable images: X, Y, RectWidth, RectHeight
; For centered/anchored items: X, Y, AnchorX, AnchorY
; ------------------------------------------------------------------------------
[UI]
Judge = 99,360
JamGauge = 4,536
HealthBar = 800,60
Pill = 200,127|200,96|200,65|200,34|200,3
WaveGage = 225,514
Playfield = 0,0
PlayingBG = 204,0
PlayFooter = 573,505
Title = 437,539,140,40
NoteMods = 589,511
VisualMods = 626,511
